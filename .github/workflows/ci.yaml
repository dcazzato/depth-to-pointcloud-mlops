name: MLOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies for Open3D
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0
        sudo apt-get install -y libgl1 libegl1 libgomp1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Environment Dependencies
      run: |
        uv pip install --system pytest open3d numpy pillow onnxruntime loguru mlflow torch torchvision

    - name: Cache ONNX Model
      id: cache-model
      uses: actions/cache@v4
      with:
        path: models/MiDaS_small.onnx
        key: ${{ runner.os }}-onnx-v1

    - name: Export Model if Not Cached
      if: steps.cache-model.outputs.cache-hit != 'true'
      run: |
        uv run python src/depth_to_pointcloud_mlops/pipeline/export_onnx.py

    - name: Run Unit and Integration Tests
      run: |
        uv run pytest tests/
